<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChallengeLock Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Inter, 'Segoe UI', system-ui, sans-serif;
        color: #faf7f3;
        user-select: none;
      }
      [hidden] {
        display: none !important;
      }
      .content {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: thin;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .content > * {
        flex-shrink: 0;
      }
      .header,
      .footer {
        flex-shrink: 0;
      }
      .condition-check {
        display: none;
      }
      .overlay-root {
        width: 100%;
        height: 100%;
        padding: 0;
        background: transparent;
      }
      .card {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        background: linear-gradient(180deg, #2e2112 0%, #1f160c 60%);
        border: 1px solid #543d22;
        border-radius: 16px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px #1f160c,
          0 12px 32px rgba(0, 0, 0, 0.5);
      }
      .drag {
        -webkit-app-region: drag;
        cursor: move;
      }
      body[data-locked='true'] .drag {
        -webkit-app-region: no-drag;
        cursor: default;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .hero-badge {
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, #bf6a5d, #7a3b31);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 19px;
        color: #fff;
      }
      .hero-info {
        flex: 1 1 0%;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .hero-name {
        font-size: 20px;
        font-weight: 800;
        line-height: 1.1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hero-meta {
        font-size: 12px;
        color: #c7aa89;
      }
      .difficulty {
        color: #ff9f86;
        font-weight: 600;
      }
      .counter {
        flex: 0 0 auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 600;
        color: #dec7ad;
        background: #3d2c18;
        border: 1px solid #614627;
        border-radius: 8px;
        padding: 5px 9px;
      }
      .conditions {
        background: #291e11;
        border: 1px solid #45311b;
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .condition {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 10px 12px;
        border-bottom: 1px solid #45311b;
      }
      .condition:last-child {
        border-bottom: 0;
      }
      .condition-check {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        box-sizing: border-box;
        border: 2px solid #795935;
        border-radius: 5px;
        margin-top: 1px;
      }
      .condition-body {
        flex: 1 1 0%;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .condition-head {
        display: flex;
        align-items: baseline;
        gap: 6px;
      }
      .condition-index {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        color: #d39a91;
      }
      .condition-name {
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .condition-desc {
        font-size: 12px;
        line-height: 1.35;
        color: #d4bea5;
      }
      .build {
        background: linear-gradient(135deg, #47331c, #312314);
        border: 1px solid #775630;
        border-radius: 12px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .build-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .build-icon {
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: #bf6a5d;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .build-icon svg {
        width: 22px;
        height: 22px;
      }
      .build-info {
        flex: 1 1 0%;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }
      .build-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        letter-spacing: 0.14em;
        color: #c7aa89;
      }
      .build-name {
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .build-meta {
        text-align: right;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .build-cost {
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        font-weight: 600;
        color: #dec7ad;
      }
      .build-tier {
        font-size: 11px;
        color: #c7aa89;
      }
      .build-progress {
        display: flex;
        gap: 3px;
        aria-hidden: true;
      }
      .build-bar {
        flex: 1 1 0%;
        height: 3px;
        border-radius: 2px;
        background: #5d4325;
      }
      .build-bar.filled {
        background: #bf6a5d;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: #c7aa89;
        margin-top: auto;
      }
      .timer {
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: #faf7f3;
      }
      .status {
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(91, 140, 255, 0.18);
        color: #f1e8dd;
        font-weight: 700;
      }
      .empty {
        display: grid;
        place-items: center;
        height: 100%;
        text-align: center;
        color: #c7aa89;
        font-size: 12px;
      }

      .card,
      main {
        background: #282226;
        border: 1px solid #a7845e;
        border-radius: 5px;
        color: #f2e4c9;
        box-shadow:
          inset 0 0 0 3px #282226,
          inset 0 0 0 4px #725d48;
      }
      .hero-name,
      #next {
        font-family: Georgia, serif;
        font-weight: 700;
      }
      #next {
        font-size: 23px;
        line-height: 1.15;
        margin-block: 6px;
      }
      #price,
      .counter {
        color: #f0c483;
      }
      #ban {
        margin-top: 12px;
        padding-block: 7px;
        border-block: 1px solid #75614e;
      }
      #hero {
        font: italic bold 17px Georgia;
        margin-top: 10px;
      }
      .hero-badge {
        background: #783f37;
        border: 1px solid #b89168;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="overlay-root">
      <div class="card">
        <div class="header drag">
          <div class="hero-badge" id="hero-badge">—</div>
          <div class="hero-info">
            <div class="hero-name" id="hero-name">—</div>
            <div class="hero-meta" id="hero-meta">
              <span class="difficulty" id="difficulty"></span>
            </div>
          </div>
          <div class="counter" id="counter">0</div>
        </div>

        <div id="match-phase" style="font-size: 11px; color: #a9b6d0" hidden></div>
        <div class="content">
          <div class="conditions" id="conditions" hidden></div>

          <div class="build" id="build" hidden>
            <div class="build-row">
              <div class="build-icon">
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#fff"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  role="img"
                  aria-label="Иконка предмета"
                >
                  <rect x="8" y="3" width="8" height="18" rx="1.5"></rect>
                  <path d="M8 8h8M8 12h8M8 16h8"></path>
                </svg>
              </div>
              <div class="build-info">
                <div class="build-label">Следующий предмет</div>
                <div class="build-name" id="build-name">—</div>
              </div>
              <div class="build-meta">
                <div class="build-cost" id="build-cost"></div>
                <div class="build-tier" id="build-tier">Тир I</div>
              </div>
            </div>
            <div id="next-skill"></div>
            <div class="build-progress" id="build-progress" aria-hidden="true"></div>
          </div>
        </div>
        <div class="footer">
          <span class="timer" id="timer">00:00</span>
          <span class="status" id="status">Ожидание</span>
        </div>
      </div>
    </div>

    <script>
      const heroBadge = document.getElementById('hero-badge');
      const heroName = document.getElementById('hero-name');
      const heroMeta = document.getElementById('hero-meta');
      const difficulty = document.getElementById('difficulty');
      const counter = document.getElementById('counter');
      const conditionsEl = document.getElementById('conditions');
      const buildEl = document.getElementById('build');
      const buildName = document.getElementById('build-name');
      const buildCost = document.getElementById('build-cost');
      const buildTier = document.getElementById('build-tier');
      const buildProgress = document.getElementById('build-progress');
      const timerEl = document.getElementById('timer');
      const statusEl = document.getElementById('status');

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function render(payload) {
        const data = payload?.contract || {};
        const settings = payload?.settings || {};
        const en = (data.lang || payload?.build?.lang) === 'en';
        const labels = en
          ? {
              waiting: 'Waiting for a challenge',
              active: 'Active',
              done: 'Completed',
              fail: 'Failed',
              next: 'Next item',
              built: 'Build complete',
              conditions: 'conditions',
            }
          : {
              waiting: 'Ожидание челленджа',
              active: 'Активен',
              done: 'Выполнено',
              fail: 'Провал',
              next: 'Следующий предмет',
              built: 'Билд собран',
              conditions: 'условий',
            };
        document.documentElement.lang = en ? 'en' : 'ru';
        document.body.dataset.locked = settings.lockPosition ? 'true' : 'false';
        document.querySelector('.header').hidden = settings.showHero === false;
        conditionsEl.hidden = settings.showConditions === false || !data.key;
        timerEl.hidden = settings.showTimer === false;
        statusEl.hidden = settings.showStatus === false;
        document.querySelector('.footer').hidden = timerEl.hidden && statusEl.hidden;
        document.querySelector('.build-label').textContent = labels.next;
        const hero = data.hero || '—';
        const diff = data.difficulty || '';
        const mode = data.mode || '';
        const conditions = Array.isArray(data.conditions) ? data.conditions : [];

        heroBadge.textContent = hero.slice(0, 1).toUpperCase();
        heroName.textContent = hero;
        heroMeta.innerHTML = `${escapeHtml(mode)} · <span class="difficulty">${escapeHtml(diff)}</span>`;
        counter.textContent =
          data.outcome === 'done'
            ? `${conditions.length}/${conditions.length}`
            : `${conditions.length} ${labels.conditions}`;
        conditionsEl.innerHTML = conditions
          .map(
            (item, index) => `
            <div class="condition">
              <div class="condition-check"></div>
              <div class="condition-body">
                <div class="condition-head">
                  <span class="condition-index">${index === 0 ? 'I' : index === 1 ? 'II' : index === 2 ? 'III' : index + 1}</span>
                  <span class="condition-name">${escapeHtml(typeof item === 'string' ? item : item.name || '')}</span>
                </div>
                ${typeof item === 'object' && item.desc ? `<div class="condition-desc">${escapeHtml(item.desc)}</div>` : ''}
              </div>
            </div>`,
          )
          .join('');

        const build = payload && payload.build ? payload.build : null;
        const showBuild = settings.showBuild !== false;
        if (showBuild && build && (build.nextItem || build.complete)) {
          buildEl.hidden = false;
          buildName.textContent = build.complete ? labels.built : build.nextItem;
          buildCost.textContent = build.complete ? '' : build.nextCost || 0;
          document.getElementById('next-skill').textContent = build.nextSkill
            ? (build.lang === 'en' ? 'Next ability: ' : 'Прокачка: ') + build.nextSkill
            : '';
          buildTier.textContent = build.complete ? '' : build.nextTier || '';
          const total = Math.max(1, (build.items && build.items.length) || 1);
          const filled = Math.min(total, (build.purchased && build.purchased.length) || 0);
          buildProgress.innerHTML = Array.from({ length: total }, (_, i) => {
            return `<div class="build-bar${i < filled ? ' filled' : ''}"></div>`;
          }).join('');
        } else {
          buildEl.hidden = true;
        }

        statusEl.textContent = !data.key
          ? labels.waiting
          : data.outcome === 'done'
            ? labels.done
            : data.outcome === 'fail'
              ? labels.fail
              : labels.active;
        timerEl.textContent = data.timer || '00:00';
      }

      function renderMatch(state) {
        const el = document.getElementById('match-phase');
        const en = document.documentElement.lang === 'en';
        el.textContent =
          state.phase === 'playing'
            ? en
              ? 'Match in progress'
              : 'Матч идёт'
            : state.phase === 'ended'
              ? en
                ? 'Match ended'
                : 'Матч закончился'
              : state.phase === 'interrupted'
                ? en
                  ? 'Disconnected'
                  : 'Соединение прервано'
                : '';
        el.hidden = !el.textContent;
      }
      window.challengeLockDesktop?.onMatch?.(renderMatch);
      window.challengeLockDesktop?.matchState?.().then(renderMatch);
      if (
        window.challengeLockDesktop &&
        typeof window.challengeLockDesktop.onOverlay === 'function'
      ) {
        window.challengeLockDesktop.onOverlay(render);
        window.challengeLockDesktop
          .overlayState?.()
          .then((state) =>
            render({ contract: state.contract, build: state.build, settings: state }),
          );
      }
      if (
        window.challengeLockDesktop &&
        typeof window.challengeLockDesktop.onOverlayTimer === 'function'
      ) {
        window.challengeLockDesktop.onOverlayTimer((value) => {
          const timer = document.getElementById('timer');
          if (timer) timer.textContent = value;
        });
      }
    </script>
  </body>
</html>
