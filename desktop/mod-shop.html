<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><title>ChallengeLock</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font:
        15px/1.35 'Segoe UI',
        sans-serif;
      color: #fcf9f6;
      background: transparent;
    }
    main {
      padding: 16px;
      background: #291e11ef;
      border: 1px solid #8e693f;
      border-radius: 12px;
    }
    h1,
    h2,
    p {
      margin: 0;
    }
    h1 {
      font-size: 19px;
    }
    h2 {
      font-size: 14px;
      color: #e3cfb8;
      margin-top: 12px;
    }
    ol {
      padding-left: 20px;
      margin: 8px 0;
    }
    li {
      margin: 5px 0;
    }
    small {
      display: block;
      color: #e7d6c2;
    }
    #next {
      font-size: 17px;
      font-weight: 600;
    }
    #items {
      color: #e7d6c2;
      margin-top: 5px;
      font-size: 13px;
    }

    .card,
    main {
      background: #282226;
      border: 1px solid #a7845e;
      border-radius: 5px;
      color: #f2e4c9;
      box-shadow:
        inset 0 0 0 3px #282226,
        inset 0 0 0 4px #725d48;
    }
    .hero-name,
    #next {
      font-family: Georgia, serif;
      font-weight: 700;
    }
    #next {
      font-size: 23px;
      line-height: 1.15;
      margin-block: 6px;
    }
    #price,
    .counter {
      color: #f0c483;
    }
    #ban {
      margin-top: 12px;
      padding-block: 7px;
      border-block: 1px solid #75614e;
    }
    #hero {
      font: italic bold 17px Georgia;
      margin-top: 10px;
    }
    .hero-badge {
      background: #783f37;
      border: 1px solid #b89168;
      border-radius: 3px;
    }
  </style>
  <main>
    <section id="build" hidden>
      <h2>Следующая покупка</h2>
      <p id="next"></p>
      <strong id="price"></strong>
    </section>
    <p id="ban" hidden></p>
    <ol id="conditions"></ol>
    <small id="checked" hidden></small>
    <h1 id="hero">ChallengeLock</h1>
    <small id="status">Подключение…</small>
  </main>
  <script>
    const el = (id) => document.getElementById(id);
    let previous;
    function render(s) {
      el('ban').textContent = s.ban || '';
      el('ban').hidden = !s.ban;
      for (const id of ['hero', 'status', 'conditions']) el(id).hidden = s.display?.[id] === false;
      el('hero').textContent = s.hero || 'ChallengeLock';
      el('status').textContent =
        { done: 'Выполнено', fail: 'Провалено' }[s.outcome] ||
        s.mode ||
        'Выбери челлендж в приложении';
      el('conditions').replaceChildren(
        ...s.conditions
          .filter((c) => !c.checked)
          .map((c) => {
            const li = document.createElement('li'),
              desc = document.createElement('small');
            li.textContent = c.name;
            desc.textContent = c.desc;
            li.append(desc);
            return li;
          }),
      );
      el('build').hidden = s.display?.build === false || !(s.next || s.complete);
      el('next').textContent = s.complete ? 'Билд собран' : s.next;
      el('price').textContent = [s.next ? s.cost + ' душ' : '', s.buildHero]
        .filter(Boolean)
        .join(' · ');
      const done = s.conditions.filter((c) => c.checked).length;
      el('checked').hidden = !done || s.display?.conditions === false;
      el('checked').textContent = 'Выполнено условий: ' + done + ' / ' + s.conditions.length;
    }
    async function tick() {
      try {
        const response = await fetch('/mod/state', { cache: 'no-store' });
        if (!response.ok) throw Error();
        const value = await response.text();
        if (value !== previous) {
          render(JSON.parse(value));
          previous = value;
        }
        document.title = 'CL-ready-' + Date.now();
      } catch {
        el('ban').hidden = true;
        el('checked').hidden = true;
        el('hero').hidden = false;
        el('status').hidden = false;
        previous = null;
        el('hero').textContent = 'ChallengeLock';
        el('status').textContent = 'Открой приложение ChallengeLock';
        el('conditions').replaceChildren();
        el('build').hidden = true;
      }
      setTimeout(tick, 1500);
    }
    tick();
  </script>
</html>
