    />

    <link
      rel="preload"
      href="assets/fonts/manrope-cyrillic.woff2"

      crossorigin
    />

    <link rel="stylesheet" href="css/contract.css" />
  </head>
  <body>
    <div class="titlebar" id="titlebar">
      <div class="titlebar-drag">
        <span class="titlebar-brand">ChallengeLock</span>
      </div>
      <div class="titlebar-controls">
        <button
          type="button"
          class="titlebar-button"
          data-window-action="minimize"
          aria-label="Свернуть"
        >
          —
        </button>
        <button
          type="button"
          class="titlebar-button"
          data-window-action="maximize"
          aria-label="Развернуть"
        >
          □
        </button>
        <button
          type="button"
          class="titlebar-button close"
          data-window-action="close"
          aria-label="Закрыть"
        >
          ×
        </button>
      </div>
    </div>
    <a class="skip-link" href="#main" data-i18n="skipContent">К содержимому</a>
    <div id="boot" class="boot" aria-busy="true" aria-label="Загрузка / Loading">
      <div class="sk"></div>
      <div class="sk s2"></div>
      <div class="sk s3"></div>
    </div>
    <div class="d" id="app" hidden>
      <nav class="rail" aria-label="Режимы / Modes">
        <div class="brand">
          <div class="logo" aria-hidden="true">✥</div>
          <span>ChallengeLock</span>
        </div>
        <div class="nav-caption mo" data-i18n="navigation">ИГРОВАЯ КОМНАТА</div>
        <button class="nb on" data-tab="roulette">
          <span data-icon="dice"></span><span data-i18n="tab.roulette">Рулетка</span>
        </button>
        <button class="nb" data-tab="build">
          <span data-icon="layers"></span><span data-i18n="tab.build">Билд</span>
        </button>
        <button class="nb" data-tab="ban">
          <span data-icon="ban"></span><span data-i18n="tab.ban">Запрет</span>
        </button>
        <button class="nb" data-tab="history">
          <span data-icon="history"></span><span data-i18n="tab.history">История</span>
        </button>
        <button class="nb" data-tab="custom">
          <span data-icon="settings"></span><span data-i18n="tab.custom">Настройки</span>
        </button>
        <button class="nb" data-tab="updates">
          <span data-icon="spark"></span><span data-i18n="tab.updates">Обновления</span>
        </button>
        <div class="rail-bottom">
          <b><span class="online-dot"></span>DEADLOCK</b
          ><span data-i18n="sidebarNote">Каждый матч — по-новому.</span>
        </div>
      </nav>
      <main class="pad" id="main" tabindex="-1">
        <header class="app-header">
          <div class="context-name">
            <b>ChallengeLock</b><span>/</span
            ><span data-i18n="headerContext">Твоя игра. Новые правила.</span>
          </div>
          <div class="header-actions">
            <button class="theme-button" id="theme" aria-label="Тёмная тема"></button
            ><button class="lang-button" id="lang" aria-label="Switch language / Сменить язык">
              EN
            </button>
          </div>
        </header>
        <section class="panel" id="p-roulette"></section>
        <section class="panel" id="p-build" hidden></section>
        <section class="panel" id="p-ban" hidden></section>
        <section class="panel" id="p-custom" hidden></section>
        <section class="panel" id="p-history" hidden></section>
        <section class="panel" id="p-updates" hidden></section>
        <footer class="foot">
          <span id="foot"></span
          ><button class="foot-version" id="foot-version" type="button" data-tab="updates"></button>
        </footer>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript
      ><p style="padding: 30px">
        Для ChallengeLock нужен JavaScript / JavaScript is required.
      </p></noscript
    >
    <script type="module" src="js/main.js"></script>
  </body>
</html>
