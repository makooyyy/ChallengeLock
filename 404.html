<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — ChallengeLock</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #101217;
        color: #f4f7ff;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      .card {
        max-width: 520px;
        text-align: center;
      }
      .mark {
        width: 84px;
        height: 84px;
        border-radius: 24px;
        background: #3375ff;
        display: grid;
        place-items: center;
        margin: 0 auto 28px;
      }
      .mark svg {
        width: 48px;
        height: 48px;
      }
      h1 {
        font-size: 64px;
        line-height: 1;
        margin: 0 0 12px;
        letter-spacing: -0.03em;
      }
      p {
        color: #a7b2c8;
        line-height: 1.6;
        margin: 0 0 28px;
      }
      a {
        display: inline-block;
        padding: 14px 26px;
        border-radius: 12px;
        background: #2c68e8;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      a:hover {
        background: #2760dd;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 96 96">
          <path
            d="M66 31c-5-5-10-7-17-7-14 0-23 10-23 24s9 24 23 24c7 0 12-2 17-7"
            fill="none"
            stroke="#fff"
            stroke-width="10"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <h1>404</h1>
      <p>Такой страницы нет. Челленджи, билды и история ждут на главной.</p>
      <a href="./">Вернуться к рулетке</a>
    </div>
  </body>
</html>
