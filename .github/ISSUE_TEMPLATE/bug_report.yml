name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and how to reproduce it.
      placeholder: Steps to reproduce...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: e.g. Chrome 120 on Windows
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / logs
