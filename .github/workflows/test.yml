name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Offline cache guard
        run: npm run check:sw
        env:
          SW_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Formatting
        run: npx prettier --check .
      - name: Unit tests
        run: node --test tests/*.test.js
