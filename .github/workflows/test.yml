name: Tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Offline cache guard
        run: npm run check:sw
        env:
          SW_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npx prettier --check .
      - name: Unit tests
        run: node --test tests/*.test.js

  browser:
    name: Browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Browser regression
        run: node tests/browser.mjs
